name: pillpal
description: "Medical Intelligence Assistant for Prescription Interpretation and Medication Adherence Support System"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter_svg: ^2.2.3
  gradient_elevated_button: ^1.1.0
  gradient_borders: ^1.0.0

  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  supabase_flutter: ^2.12.1
  flutter_dotenv: ^6.0.0
  simple_gradient_text: ^1.4.0
  mobile_scanner: ^7.2.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  google_sign_in: ^7.2.0
  crypto: ^3.0.7
  app_links: ^6.4.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  http: ^1.6.0
  http_parser: ^4.1.2
  image_cropper: ^12.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/app_icon/mia_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon/mia_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/vectors/
    - assets/docs/image/
    - assets/mockup/
    - .env

  fonts:
    - family: TestDomain
      fonts:
        - asset: assets/fonts/DomaineDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/DomaineDisplay-Medium.otf
          weight: 500
        - asset: assets/fonts/DomaineDisplay-Semibold.otf
          weight: 600
        - asset: assets/fonts/DomaineDisplay-Bold.otf
          weight: 700